services:
  graph:
    build:
      context: .
      target: graph
      args:
        OSM_DATE: "${OSM_DATE:-260909}"
    restart: "no"
    volumes:
      - graph:/graph

  app:
    build:
      context: .
    depends_on:
      graph:
        condition: service_completed_successfully
    expose:
      - 3000
    environment:
      - BETTER_AUTH_SECRET=${SERVICE_BASE64_64_APP}
      - BETTER_AUTH_URL=${SERVICE_URL_APP}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_PROVIDER_ID=${GITHUB_PROVIDER_ID:-github}
      - ROUTING_GRAPH_PATH=${ROUTING_GRAPH_PATH:-data/routing/graph.json}
    volumes:
      - graph:/app/data/routing

volumes:
  graph:
